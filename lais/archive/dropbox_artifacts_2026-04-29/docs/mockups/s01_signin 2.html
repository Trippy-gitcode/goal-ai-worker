<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=375"><title>S-01 Sign-in</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif}.phone{width:375px;height:812px;background:#0D1117;border-radius:40px;overflow:hidden;position:relative;color:#E6EDF3;border:1px solid #6E7681}.notch{width:126px;height:34px;background:#0D1117;border-radius:0 0 20px 20px;margin:0 auto}.home{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:#E6EDF3;border-radius:999px}</style></head>
<body><div class="phone"><div class="notch"></div>
<div style="padding:0 24px">
<div style="padding-top:60px;margin-bottom:48px"><div style="font-size:36px;font-weight:600;letter-spacing:3px;margin-bottom:8px;color:#79C0FF">Lais</div><div style="font-size:14px;color:#7A8593">アカウントを作成</div></div>
<div style="margin-bottom:24px"><label style="font-size:14px;color:#9BA7B4;display:block;margin-bottom:8px">メールアドレス</label><div style="background:#161B22;border:1px solid #6E7681;border-radius:8px;height:48px;padding:0 16px;display:flex;align-items:center;color:#7A8593;font-size:14px">you@example.com</div></div>
<div style="margin-bottom:24px"><label style="font-size:14px;color:#9BA7B4;display:block;margin-bottom:8px">パスワード</label><div style="background:#161B22;border:1px solid #6E7681;border-radius:8px;height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between"><span style="color:#7A8593;font-size:14px">8文字以上</span></div></div>
<div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:32px"><div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:-12px 0 -12px -12px"><div style="width:20px;height:20px;border:1.5px solid #6E7681;border-radius:4px"></div></div><span style="font-size:14px;color:#9BA7B4;line-height:1.5;letter-spacing:-0.02em;padding-top:2px"><span style="color:#79C0FF;text-decoration:underline">利用規約</span>と<span style="color:#79C0FF;text-decoration:underline">プライバシーポリシー</span>に同意します</span></div>
<div style="background:#1A5FC8;border-radius:12px;height:52px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#FFFFFF">サインアップ</div>
<div style="text-align:center;margin-top:24px;font-size:14px;color:#7A8593;letter-spacing:-0.02em">すでにアカウントをお持ちですか？ <span style="color:#79C0FF;text-decoration:underline">ログイン</span></div>
</div><div class="home"></div></div></body></html>
