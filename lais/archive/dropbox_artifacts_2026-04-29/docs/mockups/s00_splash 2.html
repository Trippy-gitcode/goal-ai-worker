<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=375"><title>S-00 Splash</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif}
.phone{width:375px;height:812px;background:#0D1117;border-radius:40px;overflow:hidden;position:relative;color:#E6EDF3;border:1px solid #6E7681;display:flex;flex-direction:column;align-items:center;justify-content:center}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#0D1117;border-radius:0 0 20px 20px;z-index:10}
.home{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:#E6EDF3;border-radius:999px}
.star{position:absolute;border-radius:50%}</style></head>
<body><div class="phone"><div class="notch"></div>
<div class="star" style="top:120px;left:45%;width:3px;height:3px;background:#79C0FF;opacity:0.4"></div>
<div class="star" style="top:180px;right:60px;width:2px;height:2px;background:#9BA7B4;opacity:0.3"></div>
<div class="star" style="top:160px;left:80px;width:2px;height:2px;background:#58A6FF;opacity:0.25"></div>
<div class="star" style="top:240px;right:90px;width:1.5px;height:1.5px;background:#E6EDF3;opacity:0.2"></div>
<div class="star" style="top:200px;left:120px;width:2.5px;height:2.5px;background:#79C0FF;opacity:0.15"></div>
<div style="text-align:center;margin-bottom:120px">
<div style="font-size:52px;font-weight:600;letter-spacing:3px;margin-bottom:12px;color:#79C0FF">Lais</div>
<div style="font-size:14px;color:#7A8593;letter-spacing:-0.02em">あなたの人生を、あなたらしく</div>
</div>
<div style="position:absolute;bottom:140px;left:24px;right:24px;display:flex;flex-direction:column;gap:12px">
<div style="background:#1A5FC8;color:#FFFFFF;border-radius:12px;height:52px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600">はじめる</div>
<div style="border:1px solid #6E7681;border-radius:12px;height:52px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#E6EDF3">ログイン</div>
</div>
<div class="home"></div></div></body></html>
