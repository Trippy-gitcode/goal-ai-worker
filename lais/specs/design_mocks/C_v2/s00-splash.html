<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>Lais - S-00 Splash (C_v2 DragonQuest)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen splash">
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-bar-icons">
        <span>📡</span>
        <span>📶</span>
        <span>🔋</span>
      </div>
    </div>

    <div class="splash-cloud c1">☁️</div>
    <div class="splash-cloud c2">☁️</div>
    <div class="splash-cloud c3">☁️</div>

    <div class="splash-emblem">
      <div class="splash-dragon">🐉</div>
      <div class="splash-slime-row">
        <span>🟦</span>
        <span>⚔️</span>
        <span>🛡️</span>
      </div>
    </div>

    <div>
      <h1 class="splash-title">LAIS</h1>
      <div class="splash-tagline-box">
        <p class="splash-tagline">A SAGA OF BECOMING</p>
        <p class="splash-tagline-jp">じぶんの ものがたりを はじめよう</p>
      </div>
    </div>

    <div class="splash-cta">
      <button class="btn-dq-yellow">
        <span>🗡 ぼうけんを はじめる</span> <span class="arrow">▼</span>
      </button>
      <button class="btn-dq-secondary">📜 つづきから (サインイン)</button>
      <p class="splash-version">~ CHAPTER I  VOL.0.12 ~</p>
    </div>
  </div>
</body>
</html>
