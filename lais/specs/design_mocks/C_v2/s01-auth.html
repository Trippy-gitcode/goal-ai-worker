<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>Lais - S-01 Auth (C_v2 DragonQuest)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen auth">
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-bar-icons">
        <span>📡</span>
        <span>📶</span>
        <span>🔋</span>
      </div>
    </div>

    <div class="auth-header">
      <div class="auth-king">👑</div>
      <h1 class="auth-title">PRESS START</h1>
      <p class="auth-subtitle">ぼうけんしゃの しょうめいを どうぞ</p>
    </div>

    <div class="auth-message-window">
      おお ぼうけんしゃよ！ <br>
      おまえの しょうめいを みせてくれ。<br>
      なまえと あいことばを にゅうりょくせよ。
    </div>

    <div class="auth-form">
      <div class="auth-label">📧 メールアドレス</div>
      <input class="auth-input" type="email" value="hero@lais.adv" />
      <div class="auth-label">🔑 あいことば (ぱすわーど)</div>
      <input class="auth-input" type="password" value="••••••••" />
    </div>

    <div class="auth-actions">
      <button class="btn-dq-yellow">
        <span>⚜ ぼうけんに もどる ⚜</span>
      </button>

      <div class="auth-divider">- OR -</div>

      <button class="btn-dq-passkey">🪄 パスキーで さんきょう</button>
      <button class="btn-dq-apple"> Sign in with Apple</button>
    </div>

    <p class="auth-foot">
      まだ ぼうけんしゃ じゃない？ <a>あたらしく はじめる</a>
    </p>
  </div>
</body>
</html>
