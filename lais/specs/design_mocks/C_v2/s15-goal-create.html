<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>Lais - S-15 Goal Create (C_v2 DragonQuest)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen goal-create">
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-bar-icons">
        <span>📡</span>
        <span>📶</span>
        <span>🔋</span>
      </div>
    </div>

    <div class="goal-bg-dim"></div>

    <!-- Sparkles -->
    <div class="goal-sparkle s1">✨</div>
    <div class="goal-sparkle s2">⭐</div>
    <div class="goal-sparkle s3">✨</div>
    <div class="goal-sparkle s4">⭐</div>

    <div class="goal-modal">
      <div class="goal-modal-head">
        <div class="goal-modal-head-title">▶ NEW QUEST</div>
        <div class="goal-modal-close">✕</div>
      </div>

      <div class="goal-modal-body">
        <div class="goal-msg">
          おお ゆうしゃ ふとしよ！<br>
          <span class="accent">あたらしい けんし のたびを</span><br>
          <span class="accent">はじめる</span> のだな。<br>
          めざす ばしょを きめてくれ。
        </div>

        <div class="goal-field">
          <div class="goal-field-label">📜 クエストめい</div>
          <input class="goal-field-input" type="text" value="えいご を きわめる の旅" />
        </div>

        <div class="goal-field">
          <div class="goal-field-label">🗓 きげん をえらぶ</div>
          <div class="goal-date-grid">
            <div class="goal-date-cell">7 NICHI</div>
            <div class="goal-date-cell">30 NICHI</div>
            <div class="goal-date-cell selected">90 NICHI</div>
            <div class="goal-date-cell">180 NICHI</div>
            <div class="goal-date-cell">1 NEN</div>
            <div class="goal-date-cell">CUSTOM</div>
          </div>
        </div>

        <div class="goal-field">
          <div class="goal-field-label">⚔️ どうぐ (タグ)</div>
          <input class="goal-field-input" type="text" value="#ENGLISH  #LEARNING  #DAILY" />
        </div>

        <div class="goal-actions">
          <button class="btn-dq-secondary">🚪 やめる</button>
          <button class="btn-dq-yellow"><span>⚜ はじめる</span></button>
        </div>

        <div class="goal-encourage">
          <span>🌟</span> たびの しゅくふくを いただいた！ <span>🌟</span>
        </div>
      </div>
    </div>

    <!-- Bottom Tab -->
    <div class="bottom-tab">
      <div class="tab-item">
        <div class="tab-icon">🗡</div>
        <div>たたかう</div>
        <div class="tab-label-en">GROW</div>
      </div>
      <div class="tab-item">
        <div class="tab-icon">✨</div>
        <div>じゅもん</div>
        <div class="tab-label-en">TALK</div>
      </div>
      <div class="tab-item active">
        <div class="tab-icon">📜</div>
        <div>どうぐ</div>
        <div class="tab-label-en">GOAL</div>
      </div>
      <div class="tab-item">
        <div class="tab-icon">📖</div>
        <div>きろく</div>
        <div class="tab-label-en">LOG</div>
      </div>
      <div class="tab-item">
        <div class="tab-icon">🛡️</div>
        <div>そうび</div>
        <div class="tab-label-en">ME</div>
      </div>
    </div>
  </div>
</body>
</html>
