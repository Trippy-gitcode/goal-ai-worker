<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>Lais — S-00 Splash (案 B_v2 Hogwarts)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="screen s00">
  <div class="ornate-border"></div>
  <div class="corner-flourish tl">G</div>
  <div class="corner-flourish tr">S</div>
  <div class="corner-flourish bl">R</div>
  <div class="corner-flourish br">H</div>
  <div class="stained-glass left"></div>
  <div class="stained-glass right"></div>

  <div class="content">
    <div class="status-bar">
      <span class="time">9:41</span>
      <span>⚜ 🪄 ▮▮▮</span>
    </div>

    <div class="splash-content">
      <!-- Hogwarts 校章 (盾形) -->
      <div class="hogwarts-crest">
        <div class="hogwarts-crest-shield">
          <div class="hogwarts-crest-letter">L</div>
          <div class="hogwarts-crest-banner">DRACO DORMIENS NUNQUAM TITILLANDUS</div>
        </div>
      </div>

      <h1 class="splash-title">LAIS</h1>
      <div class="splash-subtitle">— School of Witchcraft & Inner Wisdom —</div>

      <p class="splash-tagline">
        <em>Hogwarts is your home, soul is your spell.</em>
        Where every witch and wizard inscribes<br>their own grimoire of becoming.
        <span class="splash-tagline-jp">— 魂の grimoire を、ここに編む —</span>
      </p>

      <button class="splash-cta">はじめる</button>
      <a class="splash-cta-secondary">既に在校生の方 ➢ 9¾ 番線へ</a>
    </div>

    <!-- 4 寮カラー切替プレビュー -->
    <div class="house-switcher">
      <div class="house-chip gryffindor" title="Gryffindor"></div>
      <div class="house-chip slytherin" title="Slytherin"></div>
      <div class="house-chip ravenclaw" title="Ravenclaw"></div>
      <div class="house-chip hufflepuff" title="Hufflepuff"></div>
    </div>

    <div class="splash-candles">
      <span>🕯</span>
      <span>🕯</span>
      <span>🕯</span>
    </div>

    <div class="home-indicator"></div>
  </div>
</main>
</body>
</html>
