<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>Lais — S-01 Auth (案 B_v2 Hogwarts)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="screen s01">
  <div class="ornate-border"></div>
  <div class="corner-flourish tl">G</div>
  <div class="corner-flourish tr">S</div>
  <div class="corner-flourish bl">R</div>
  <div class="corner-flourish br">H</div>
  <div class="stained-glass left"></div>
  <div class="stained-glass right"></div>

  <div class="content">
    <div class="status-bar">
      <span class="time">9:41</span>
      <span>⚜ 🪄 ▮▮▮</span>
    </div>

    <div class="auth-header">
      <a class="auth-back">‹ 戻る</a>
      <div class="auth-icon">🪄</div>
      <h2 class="auth-title">SIGN IN</h2>
      <div class="auth-subtitle">9¾ 番線 — 在校生の入校手続き</div>
      <span class="platform-badge">PLATFORM 9¾</span>
    </div>

    <div class="auth-divider-h"></div>

    <form class="auth-form" onsubmit="return false">
      <div class="auth-field">
        <label class="auth-label">🦉 OWL POST — 書信の宛先</label>
        <div class="auth-input-wrap">
          <span class="auth-input-icon">📜</span>
          <input class="auth-input" type="email" placeholder="wizard@hogwarts.lais" value="futoshi@hogwarts.lais">
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label">🗝 INCANTATION — 賢者の呪文</label>
        <div class="auth-input-wrap">
          <span class="auth-input-icon">🪄</span>
          <input class="auth-input" type="password" placeholder="呪文を唱えよ" value="••••••••••••">
        </div>
        <span class="auth-help">Obliviate — 呪文をお忘れですか?</span>
      </div>

      <button class="auth-submit">⚜ 校門をくぐる ⚜</button>

      <div class="auth-or">— OR —</div>

      <div class="auth-alt">
        <button class="auth-alt-btn">
          <span style="font-size:16px">🎩</span>
          <span>SORTING HAT (パスキー)</span>
        </button>
        <button class="auth-alt-btn auth-alt-btn-apple">
          <span style="font-size:16px"></span>
          <span>SIGN IN WITH APPLE</span>
        </button>
      </div>
    </form>

    <div class="auth-footer">
      まだ入学許可証 (Hogwarts Letter) をお持ちでない方は<br>
      <a>✦ 新たな grimoire を編む ✦</a>
    </div>

    <div class="home-indicator"></div>
  </div>
</main>
</body>
</html>
