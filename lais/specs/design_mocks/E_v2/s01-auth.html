<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Lais — S-01 Auth | 案 E_v2 Cyberpunk 2077</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">

  <div class="statusbar">
    <span class="time">22:48</span>
    <span class="indicators">
      <span class="ind-dot"></span>
      <span class="net">5G</span>
      <span class="bat">98%</span>
    </span>
  </div>

  <div class="hud-corner tl"></div>
  <div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div>
  <div class="hud-corner br"></div>

  <!-- タテ書き漢字看板 (右側) -->
  <div class="s01-vertical-sign">認<br>証</div>

  <!-- 装飾 (Night City Ad 風) -->
  <div class="sign-horizontal" style="top: 50px; left: 32px; font-family: var(--f-mono); font-size: 13px; color: var(--c-cyan); text-shadow: var(--g-cyan); letter-spacing: 0.2em; z-index: 6;">// AUTH_PROTOCOL.exe</div>

  <div class="s01-content">
    <div class="s01-back">&lt; BACK</div>

    <!-- 巨大タイトル -->
    <div class="s01-title-block">
      <div class="s01-title">
        SIGN<br>IN_
        <span class="glitch">SIGN<br>IN_</span>
      </div>
      <div class="s01-title-jp">サ イ ン イ ン</div>
    </div>

    <!-- メールアドレス -->
    <div class="s01-field-label">
      <span>&gt; EMAIL</span>
      <span class="field-jp">メ ー ル</span>
    </div>
    <div class="s01-input-wrap">
      <input type="text" class="s01-input filled" value="futoshi@lais.io" readonly>
      <span class="s01-input-marker"></span>
    </div>

    <!-- パスワード -->
    <div class="s01-field-label">
      <span>&gt; PASSWORD</span>
      <span class="field-jp">パスワード</span>
    </div>
    <div class="s01-input-wrap">
      <input type="text" class="s01-input filled" value="••••••••••••" readonly style="letter-spacing:0.25em;">
      <span class="s01-input-marker"></span>
    </div>

    <!-- Sign in -->
    <button class="s01-signin-btn">EXECUTE_SIGNIN »</button>

    <!-- divider -->
    <div class="s01-divider">// OR_USE //</div>

    <!-- Passkey -->
    <button class="s01-alt-btn">
      <svg class="alt-icon" viewBox="0 0 18 18" fill="none">
        <rect x="3" y="7" width="12" height="9" stroke="#00ffe0" stroke-width="1.4"/>
        <path d="M5.5 7 V4.5 a3.5 3.5 0 0 1 7 0 V7" stroke="#00ffe0" stroke-width="1.4" fill="none"/>
        <circle cx="9" cy="11.5" r="1.2" fill="#00ffe0"/>
      </svg>
      <span>PASSKEY</span>
      <span class="alt-jp">パ ス キ ー</span>
    </button>

    <!-- Sign in with Apple -->
    <button class="s01-alt-btn" style="border-color: var(--c-text); color: var(--c-text); text-shadow: 0 0 6px rgba(232,232,237,0.5);">
      <svg class="alt-icon" viewBox="0 0 16 16" fill="#e8e8ed">
        <path d="M11.182 8.156a3.5 3.5 0 0 0 1.65 2.95c-.2.62-.43 1.21-.84 1.78-.55.79-1.13 1.57-2.04 1.59-.89.02-1.18-.53-2.21-.53s-1.34.51-2.18.55c-.88.04-1.55-.85-2.1-1.64-1.13-1.62-2-4.59-.83-6.59.58-.99 1.62-1.62 2.74-1.64.86-.02 1.67.58 2.21.58.53 0 1.52-.71 2.56-.6.43.02 1.65.17 2.43 1.32-.06.04-1.45.85-1.39 2.23zM9.6 3.04c.46-.56.78-1.34.69-2.11-.66.03-1.46.44-1.94 1-.43.49-.81 1.29-.71 2.04.74.06 1.5-.37 1.96-.93z"/>
      </svg>
      <span>WITH_APPLE</span>
      <span class="alt-jp">ア ッ プ ル</span>
    </button>

    <!-- セキュリティ警告 -->
    <div class="s01-warning">
      <span style="color: var(--c-magenta); text-shadow: var(--g-magenta); font-weight:900; font-family: var(--f-display);">[!]</span>
      <div>
        <div>SECURE_CHANNEL: TLS_1.3 / E2E</div>
        <div class="warning-jp">エンクリプテッド接続</div>
      </div>
    </div>

    <div class="s01-footer-meta">
      <span>NODE_ID: 0xLAIS:01</span>
      <span class="ok">CONN_OK</span>
    </div>
  </div>

</div>
</body>
</html>
