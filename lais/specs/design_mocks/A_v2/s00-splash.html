<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Lais — S-00 Splash (案 A_v2: Apple+トトロ)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen s00 komorebi-bg">

    <!-- 背景の浮遊する葉っぱ (4 個) -->
    <div class="leaf" style="top: 90px; left: 28px; transform: rotate(-22deg);">
      <svg width="46" height="46" viewBox="0 0 64 64" fill="none">
        <path d="M32 6 C18 6, 8 18, 8 34 C8 46, 16 56, 28 58 C32 50, 38 42, 48 38 C56 32, 60 22, 56 12 C50 8, 42 6, 32 6 Z" fill="#a8c895" opacity="0.65"/>
        <path d="M32 6 C32 22, 30 40, 28 58" stroke="#7a9c5f" stroke-width="1.2" fill="none" opacity="0.6"/>
        <path d="M28 22 L36 18 M26 32 L38 28 M26 42 L36 40" stroke="#7a9c5f" stroke-width="0.8" opacity="0.4"/>
      </svg>
    </div>
    <div class="leaf" style="top: 130px; right: 24px; transform: rotate(38deg); opacity: 0.28;">
      <svg width="40" height="40" viewBox="0 0 64 64" fill="none">
        <path d="M32 6 C18 6, 8 18, 8 34 C8 46, 16 56, 28 58 C32 50, 38 42, 48 38 C56 32, 60 22, 56 12 C50 8, 42 6, 32 6 Z" fill="#a8c895"/>
        <path d="M32 6 C32 22, 30 40, 28 58" stroke="#7a9c5f" stroke-width="1.2" fill="none" opacity="0.6"/>
      </svg>
    </div>
    <div class="leaf" style="bottom: 290px; left: 16px; transform: rotate(85deg); opacity: 0.22;">
      <svg width="34" height="34" viewBox="0 0 64 64" fill="none">
        <path d="M32 6 C18 6, 8 18, 8 34 C8 46, 16 56, 28 58 C32 50, 38 42, 48 38 C56 32, 60 22, 56 12 C50 8, 42 6, 32 6 Z" fill="#a8c895"/>
      </svg>
    </div>
    <div class="leaf" style="bottom: 230px; right: 30px; transform: rotate(-50deg); opacity: 0.30;">
      <svg width="44" height="44" viewBox="0 0 64 64" fill="none">
        <path d="M32 6 C18 6, 8 18, 8 34 C8 46, 16 56, 28 58 C32 50, 38 42, 48 38 C56 32, 60 22, 56 12 C50 8, 42 6, 32 6 Z" fill="#d4e5cd"/>
        <path d="M32 6 C32 22, 30 40, 28 58" stroke="#7a9c5f" stroke-width="1.2" fill="none" opacity="0.6"/>
      </svg>
    </div>

    <!-- StatusBar -->
    <div class="statusbar">
      <span>9:41</span>
      <div class="island"></div>
      <div class="icons">
        <span>●●●</span>
        <span>◴</span>
        <span>▮▮</span>
      </div>
    </div>

    <!-- ロゴ + キャッチコピー -->
    <div class="logo-wrap">
      <div class="seal-totoro lg">
        <div class="seal-box">籟</div>
        <!-- 葉っぱの装飾 (右上) -->
        <svg class="seal-leaf" viewBox="0 0 64 64" fill="none">
          <path d="M32 6 C18 6, 8 18, 8 34 C8 46, 16 56, 28 58 C32 50, 38 42, 48 38 C56 32, 60 22, 56 12 C50 8, 42 6, 32 6 Z" fill="currentColor"/>
          <path d="M32 6 C32 22, 30 40, 28 58" stroke="#5a7a45" stroke-width="2" fill="none"/>
        </svg>
        <!-- 葉っぱの装飾 (左下) -->
        <svg class="seal-leaf-2" viewBox="0 0 64 64" fill="none">
          <path d="M32 6 C18 6, 8 18, 8 34 C8 46, 16 56, 28 58 C32 50, 38 42, 48 38 C56 32, 60 22, 56 12 C50 8, 42 6, 32 6 Z" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand">Lais</div>
      <div class="tagline">
        しずかに、自分と向き合う。
      </div>
      <div class="tagline-sub">
        <span style="font-size: 14px;">🌿</span>
        主人公として、生きる
        <span style="font-size: 14px;">🌿</span>
      </div>

      <!-- 月相 deco -->
      <div class="moon-deco">
        <span class="moon new"></span>
        <span class="moon crescent"></span>
        <span class="moon half"></span>
        <span class="moon gibbous"></span>
        <span class="moon full"></span>
      </div>
    </div>

    <!-- CTA 群 -->
    <div class="cta-area">
      <button class="btn btn-primary btn-block">はじめる</button>
      <button class="btn btn-secondary btn-block">ログイン</button>
      <div class="copyright">— 籟 (lais) — </div>
    </div>

  </div>
</body>
</html>
