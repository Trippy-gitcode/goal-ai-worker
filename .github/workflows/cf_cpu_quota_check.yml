name: cf-cpu-quota-check
on:
  schedule:
    - cron: "0 */6 * * *"   # 6 時間毎
  workflow_dispatch:
jobs:
  check_cpu:
    runs-on: ubuntu-latest
    steps:
      - name: query_cf_analytics
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::warning::CF_API_TOKEN / CF_ACCOUNT_ID 未設定 — CPU quota check skip (PO action 待ち)"
            exit 0
          fi
          # GraphQL Analytics で 直近 6h の CPU avg / max を取得
          QUERY='{ viewer { accounts(filter: {accountTag: "'"$CF_ACCOUNT_ID"'"}) { workersInvocationsAdaptive(filter: {datetime_geq: "'"$(date -u -d '6 hours ago' +%FT%TZ 2>/dev/null || date -u -v-6H +%FT%TZ)"'"}, limit: 100) { sum { requests } quantiles { cpuTimeP99 } dimensions { scriptName } } } } }'
          RESPONSE=$(curl -sS -X POST https://api.cloudflare.com/client/v4/graphql \
            -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" \
            -d "{\"query\": $(echo "$QUERY" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')}")
          echo "$RESPONSE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          results = d.get('data', {}).get('viewer', {}).get('accounts', [])
          for acc in results:
            for inv in acc.get('workersInvocationsAdaptive', []):
              p99 = inv.get('quantiles', {}).get('cpuTimeP99', 0) / 1000  # microsec -> millisec
              name = inv.get('dimensions', {}).get('scriptName', '?')
              print(f'{name}: cpu_p99={p99:.2f}ms')
              if p99 > 8.0:  # 80% of 10ms quota
                print(f'::warning::cpu p99 {p99:.2f}ms > 8ms (80% quota) for {name}')
          " || true

      - name: open_issue_on_threshold
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label "incident-cpu-quota" --state open --json number --jq 'length' || echo "0")
          if [ "${EXISTING:-0}" -eq 0 ]; then
            gh issue create \
              --title "[cf-cpu-quota] 直近 6h で CPU p99 > 8ms (80% of 10ms quota)" \
              --label "incident-cpu-quota,incident-critical" \
              --body "CF Workers CPU quota alert (P2#32 fix)。 詳細は workflow run log。"
          fi
