name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: bash syntax check
        run: |
          set -u
          fail=0
          shopt -s nullglob
          for f in scripts/*.sh scripts/lib/*.sh; do
            if [ -f "$f" ]; then
              if ! bash -n "$f"; then
                echo "::error file=$f::bash -n syntax error"
                fail=1
              fi
            fi
          done
          exit $fail

      - name: changeable_policy_lint
        run: |
          if [ -x scripts/changeable_policy_lint.sh ]; then
            bash scripts/changeable_policy_lint.sh
          else
            echo "scripts/changeable_policy_lint.sh not found or not executable, skipping"
          fi

      - name: spec_lint_extended
        run: |
          if [ -x scripts/spec_lint_extended.sh ] && [ -f core_spec.md ]; then
            bash scripts/spec_lint_extended.sh core_spec.md
          else
            echo "scripts/spec_lint_extended.sh not found or not executable, skipping"
          fi

      - name: devsystem_healthcheck
        run: |
          if [ -x scripts/devsystem_healthcheck.sh ]; then
            bash scripts/devsystem_healthcheck.sh --fail-on-warn || true
          else
            echo "scripts/devsystem_healthcheck.sh not found or not executable, skipping"
          fi

      - name: version_drift_check
        # external review GPT-5.4 R-002 (2026-05-01) — APP_VERSION の 5 箇所
        # hardcode (constants.js / globals.js / sw.js / index.html data-attr / text)
        # が drift していないか CI で検証する。drift 時は exit 1 で main / PR を block。
        # Round 24 R-003 fix: 旧 silent-skip (script 不在で fail-open) を
        # fail-on-missing に変更、guard 喪失を block。
        run: |
          if [ ! -f scripts/version_drift_check.sh ]; then
            echo "::error::scripts/version_drift_check.sh missing — version drift gate has been silently disabled. Restore the script."
            exit 1
          fi
          chmod +x scripts/version_drift_check.sh
          sh scripts/version_drift_check.sh

      - name: pgrest_safety_check
        # external review GPT-5.4 R-007 (2026-05-01) — `safePgrestValue(` 単独利用
        # (= 直後に isSafePgrestValue check / requireSafePgrestValue 利用なし) の
        # 新規追加を block。baseline は verify/pgrest_safety_baseline.txt から読込。
        # Round 24 R-003 fix: silent-skip → fail-on-missing に変更。
        run: |
          if [ ! -f scripts/pgrest_safety_check.sh ]; then
            echo "::error::scripts/pgrest_safety_check.sh missing — PostgREST safety gate disabled. Restore the script."
            exit 1
          fi
          chmod +x scripts/pgrest_safety_check.sh
          sh scripts/pgrest_safety_check.sh

      - name: i18n_coverage_check
        # external review GPT-5.4 Round 23 R-002 (2026-05-01) — frontend/i18n/ja.json
        # の _meta.coverage_keys_current が実ファイル key 数と drift していないか検証。
        # Round 24 R-003 fix: silent-skip → fail-on-missing に変更。
        run: |
          if [ ! -f scripts/i18n_coverage_check.sh ]; then
            echo "::error::scripts/i18n_coverage_check.sh missing — i18n coverage gate disabled. Restore the script."
            exit 1
          fi
          chmod +x scripts/i18n_coverage_check.sh
          sh scripts/i18n_coverage_check.sh

      - name: gitleaks_secret_scan
        # Round 31 honest audit P4#43 fix (2026-05-02): gitleaks CI gate 配備。
        #   旧: pre-commit hook の gitleaks のみで、 PR 経由 push (hook 走らない)
        #       や別 dev machine から gitleaks 未 install で push された secret は
        #       検出 0 (.env / API key / DB password leak risk)。
        #   新: CI で全 PR + main push を gitleaks で走査、 検出時 fail-close。
        #   .gitleaks.toml allowlist (8 false positive 除外) を継続使用。
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: vitest_with_coverage
        # Round 31 honest audit P5#45 fix (2026-05-02): coverage % CI 強制 gate 配備。
        #   旧: vitest.config.js threshold (lines 70/branches 60/funcs 70/stmts 70) は
        #       set されているが CI で `vitest run` のみ、 `--coverage` flag なし =
        #       threshold 違反は CI で検出されず、 「coverage 79.9%」 主張は手動測定のみ。
        #   新: CI で `vitest run --coverage` 実行、 threshold 違反時 exit 1 で main を block。
        run: |
          if [ -f package.json ] && grep -q '"vitest"' package.json; then
            npm ci --no-audit --no-fund --silent
            npx vitest run --coverage --reporter=default
          else
            echo "vitest 未設定、 skip"
          fi
