name = "goal-ai-worker"
main = "src/index.js"
compatibility_date = "2024-12-01"

# ── スマートプレイスメント ──
[placement]
mode = "smart"

# ── 開発用 ──
[dev]
port = 8787

# ── Observability (Cloudflare Workers Logs) ──
# SUBAGENT-LAIS-COMPREHENSIVE-FIX-V1 (2026-05-01) Wave 1 #52 monitoring P0:
#   observability layer 完全未配線 → enabled=true で Workers Logs 有効化。
#   head_sampling_rate=1.0 で 100% sample (production traffic 規模なら問題なし)。
#   tail_consumers は staging/log forward が必要になった時点で別 Worker を結線する想定。
[observability]
enabled = true
head_sampling_rate = 1.0

# ── Cron Triggers (scheduled handler 配線済み) ──
# SUBAGENT-LAIS-COMPREHENSIVE-FIX-V1 (2026-05-01) Wave 1 #52 monitoring P1:
#   Cron Triggers + scheduled handler 完全不在 → 5 min 周期 health check cron を追加。
#   src/index.js の scheduled handler で /health 同等処理を実行、Cloudflare Workers
#   Cron Triggers タブで成功/失敗を観測可能。hourly/daily の長期 batch は別途追加検討。
# SUBAGENT-LAIS-AUDITLOG-CRON-TRIGGER-FIX-V2 (2026-05-02) Cat-J P0 #1 follow-up:
#   pg_cron 不在環境向けに 02:00 UTC 日次 cron を追加。 scheduled handler 内で
#   event.cron === "0 2 * * *" branch が delete_old_audit_log RPC を Supabase REST 経由で
#   呼出 → audit_log 30 日 retention DELETE が pg_cron 不在環境でも日次実行される。
[triggers]
crons = [
  "*/5 * * * *",
  "0 2 * * *",
]

# ── KV Namespace ──
# 作成コマンド:
#   wrangler kv namespace create TOKEN_KV
#   wrangler kv namespace create TOKEN_KV --preview
[[kv_namespaces]]
binding = "TOKEN_KV"
id = "a5c45e6d1b454d27be42020a802e4cdd"
preview_id = "f6f98222ca8a4d0fb1e9e1335725b37c"

# ── 環境変数（非機密） ──
[vars]
ALLOWED_ORIGINS = "https://goal-ai-frontend.pages.dev,https://delicate-bienenstitch-b734d6.netlify.app,http://localhost:3000,http://localhost:5173,http://localhost:8080"

# ── Secrets（CLI で設定） ──
# wrangler secret put ANTHROPIC_API_KEY
# wrangler secret put OPENAI_API_KEY
# wrangler secret put GEMINI_API_KEY
# wrangler secret put TOKEN_SECRET

# ── ステージング環境 ──
# Round 29 follow-up (2026-05-02): cosbiz2104 account に staging worker を deploy、
#   PO action 待たずに real Worker 環境で E2E retest 可能化。
#   KV namespace = TOKEN_KV_STAGING (cosbiz2104 own、 production isolated)。
[env.staging]
name = "goal-ai-worker-staging"
[env.staging.vars]
ALLOWED_ORIGINS = "https://delicate-bienenstitch-b734d6.netlify.app,http://localhost:3000,http://localhost:8080"
[[env.staging.kv_namespaces]]
binding = "TOKEN_KV"
id = "61fb2a70b0534d268c9fe370349ad562"
[env.staging.observability]
enabled = true
head_sampling_rate = 1.0
[env.staging.triggers]
crons = ["*/5 * * * *", "0 2 * * *"]

# ── 本番環境 ──
# Round 30 fix (2026-05-02): top-level kv_namespaces は env override 時に継承されない
#   仕様 (wrangler 仕様)、 各 env block で明示的に bind 必須。 production deploy で
#   /api/token/register が 'Registration error' になった root cause。
[env.production]
name = "goal-ai-worker"
[env.production.vars]
ALLOWED_ORIGINS = "https://goal-ai-frontend.pages.dev,https://delicate-bienenstitch-b734d6.netlify.app"
[[env.production.kv_namespaces]]
binding = "TOKEN_KV"
id = "a5c45e6d1b454d27be42020a802e4cdd"
preview_id = "f6f98222ca8a4d0fb1e9e1335725b37c"
[env.production.observability]
enabled = true
head_sampling_rate = 1.0
[env.production.triggers]
crons = ["*/5 * * * *", "0 2 * * *"]
