<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#243028;--bg2:#2c3a31;--bg3:#354439;
  --chalk:rgba(255,240,200,0.9);--chalk2:rgba(255,240,200,0.5);--chalk3:rgba(255,240,200,0.28);
  --gold:rgba(255,220,140,1);--gold-d:rgba(255,220,140,0.12);--gold-b:rgba(255,220,140,0.25);
  --red:#e06868;--red-d:rgba(224,104,104,0.12);
  --green:#5db896;--green-d:rgba(93,184,150,0.12);
  --amber:#d4a050;--amber-d:rgba(212,160,80,0.12);
  --ff:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;
  --border:rgba(255,240,200,0.08);--border2:rgba(255,240,200,0.15);
}
.phone{width:100%;max-width:340px;margin:0 auto;border-radius:18px;border:0.5px solid var(--border2);background:var(--bg);overflow:hidden;height:700px;display:flex;flex-direction:column;position:relative;font-family:var(--ff)}

/* Status bar */
.ph-s{height:18px;padding:3px 14px;display:flex;align-items:center;justify-content:space-between;font-size:8px;color:var(--chalk3)}

/* Top bar */
.top{display:flex;align-items:center;padding:6px 14px;flex-shrink:0}
.top-ham{width:20px;height:20px;display:flex;flex-direction:column;justify-content:center;gap:3px;cursor:pointer}
.top-ham span{height:1.5px;background:var(--chalk2);border-radius:1px}
.top-sp{flex:1}
.top-logo{width:24px;height:24px;opacity:0.4}
.top-logo svg{width:24px;height:24px}

/* Greeting */
.greet{padding:16px 16px 0}
.greet-time{font-size:10px;color:var(--chalk3);letter-spacing:0.5px}
.greet-msg{font-size:20px;color:var(--chalk);font-weight:300;margin-top:2px;line-height:1.3}
.greet-date{font-size:11px;color:var(--chalk2);margin-top:4px}

/* Secretary memo */
.memo{margin:12px 14px 0;border-radius:8px;border:0.5px solid var(--border2);overflow:hidden}
.memo-head{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg2);cursor:pointer}
.memo-head svg{width:12px;height:12px;flex-shrink:0}
.memo-title{font-size:9px;font-weight:500;color:var(--gold);flex:1}
.memo-toggle{font-size:8px;color:var(--chalk3)}
.memo-body{padding:0 10px 8px;background:var(--bg2)}
.memo-item{display:flex;align-items:flex-start;gap:6px;padding:4px 0;font-size:8px;color:var(--chalk2);line-height:1.4}
.memo-item svg{width:10px;height:10px;flex-shrink:0;margin-top:1px}
.memo-warn svg{stroke:var(--red)}
.memo-note svg{stroke:var(--gold)}

/* Task list */
.tasks{flex:1;overflow-y:auto;padding:10px 14px 0}
.task-label{font-size:8px;font-weight:500;color:var(--chalk3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.task{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:0.5px solid var(--border)}
.task:last-child{border:none}
.task-drag{width:10px;display:flex;flex-direction:column;gap:1.5px;opacity:0.25;flex-shrink:0}
.task-drag span{display:flex;gap:2px}
.task-drag span::before,.task-drag span::after{content:'';width:2px;height:2px;border-radius:50%;background:var(--chalk3)}
.task-num{width:18px;height:18px;border-radius:50%;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--chalk2);flex-shrink:0}
.task-num.first{border-color:var(--gold);color:var(--gold);background:var(--gold-d)}
.task-body{flex:1;min-width:0}
.task-name{font-size:11px;color:var(--chalk);line-height:1.3}
.task-time{font-size:8px;color:var(--chalk3);margin-top:1px}
.task-tag{font-size:6px;padding:2px 5px;border-radius:3px;flex-shrink:0;white-space:nowrap}
.task-tag-goal{background:var(--gold-d);color:var(--gold);border:0.5px solid var(--gold-b)}
.task-done .task-name{text-decoration:line-through;opacity:0.35}
.task-done .task-num{opacity:0.3}
.task-done .task-num::after{content:'';position:absolute}

/* Comment input */
.comment{padding:8px 14px;flex-shrink:0}
.comment-box{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;border:0.5px solid var(--border);background:var(--bg2)}
.comment-text{font-size:9px;color:var(--chalk3);flex:1}
.comment-icon svg{width:12px;height:12px;stroke:var(--chalk3);fill:none;stroke-width:1.5}

/* Goal progress */
.goals-strip{padding:6px 14px 8px;display:flex;gap:10px;flex-shrink:0;border-top:0.5px solid var(--border)}
.goal-mini{display:flex;align-items:center;gap:4px}
.goal-mini-name{font-size:7px;color:var(--chalk3)}
.goal-mini-pct{font-size:9px;font-weight:600;color:var(--gold)}

/* Add task FAB */
.fab-add{position:absolute;bottom:54px;right:14px;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#c8920a,#f5d380);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(200,146,10,0.3)}
.fab-add svg{width:16px;height:16px;stroke:#243028;stroke-width:2.5;fill:none}

/* Calendar FAB */
.fab-cal{position:absolute;bottom:54px;left:14px;width:28px;height:28px;border-radius:50%;border:0.5px solid var(--border2);background:var(--bg2);display:flex;align-items:center;justify-content:center}
.fab-cal svg{width:12px;height:12px;stroke:var(--chalk3);fill:none;stroke-width:1.5}

/* Bottom tab */
.btab{display:flex;height:42px;border-top:0.5px solid var(--border2);flex-shrink:0;background:var(--bg)}
.btab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.btab-item svg{width:16px;height:16px;stroke:var(--chalk3);fill:none;stroke-width:1.5}
.btab-item span{font-size:7px;color:var(--chalk3)}
.btab-item.active svg{stroke:var(--gold)}
.btab-item.active span{color:var(--gold);font-weight:600}
</style>

<div class="phone">
  <div class="ph-s"><span>7:30</span><span>...</span></div>

  <!-- Top bar: hamburger + logo -->
  <div class="top">
    <div class="top-ham"><span></span><span></span><span></span></div>
    <div class="top-sp"></div>
    <div class="top-logo"><svg viewBox="0 0 32 32"><path d="M5 24l4-11 3 5L16 6l4 12 3-5 4 11H5z" fill="rgba(255,220,140,0.4)"/></svg></div>
  </div>

  <!-- Greeting -->
  <div class="greet">
    <div class="greet-time">GOOD MORNING</div>
    <div class="greet-msg">おはよう。今日は5つのタスク。</div>

  <!-- Secretary memo -->
  <div class="memo">
    <div class="memo-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>

    <div class="memo-body">
      <div class="memo-item memo-warn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>レポート提出が期限切れです。午前中に対応を。</span>
      </div>

        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>動画編集→SEOリサーチの順が効率的です（午前は集中力が高い）。</span>
      </div>
    </div>

  <!-- Task list -->
  <div class="tasks">
    <div class="task-label">Today's Tasks</div>

    <div class="task">
      <div class="task-drag"><span></span><span></span><span></span></div>
      <div class="task-num first">1</div>
      <div class="task-body">
        <div class="task-name">動画編集（3本目）</div>
        <div class="task-time">09:00 - 11:00  2h</div>
      </div>
      <div class="task-tag task-tag-goal">YouTube</div>
    </div>

    <div class="task">
      <div class="task-drag"><span></span><span></span><span></span></div>
      <div class="task-num">2</div>
      <div class="task-body">
        <div class="task-name">SEOリサーチ</div>
        <div class="task-time">11:00 - 12:00  1h</div>
      </div>
    </div>

    <div class="task">
      <div class="task-drag"><span></span><span></span><span></span></div>
      <div class="task-num">3</div>
      <div class="task-body">
        <div class="task-name" style="color:var(--red)">レポート提出</div>
        <div class="task-time" style="color:var(--red)">期限切れ</div>
      </div>
    </div>

    <div class="task">
      <div class="task-drag"><span></span><span></span><span></span></div>
      <div class="task-num">4</div>
      <div class="task-body">
        <div class="task-name">コラボ企画連絡</div>
        <div class="task-time">14:00 - 15:00  1h</div>
      </div>
      <div class="task-tag task-tag-goal">副業</div>
    </div>

    <div class="task task-done">
      <div class="task-drag"><span></span><span></span><span></span></div>
      <div class="task-num">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="task-body">
        <div class="task-name">ジム予約</div>
      </div>
    </div>
  </div>

  <!-- Comment input -->
  <div class="comment">
    <div class="comment-box">
      <div class="comment-text">状況を伝える（例: 午後は外出）</div>
      <div class="comment-icon"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div>
    </div>
  </div>

  <!-- Goal progress strip -->
  <div class="goals-strip">
    <div class="goal-mini"><span class="goal-mini-name">YouTube</span><span class="goal-mini-pct">64%</span></div>
    <div class="goal-mini"><span class="goal-mini-name">副業</span><span class="goal-mini-pct">38%</span></div>
    <div class="goal-mini"><span class="goal-mini-name">健康</span><span class="goal-mini-pct">72%</span></div>
  </div>

  <!-- FABs -->
  <div class="fab-add"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
  <div class="fab-cal"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>

  <!-- Bottom tabs -->
  <div class="btab">

      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 8 14"/></svg>

    <div class="btab-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      <span>GOALS</span>
    </div>
    <div class="btab-item">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>ME</span>
    </div>
  </div>
</div>
