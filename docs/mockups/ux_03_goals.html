<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#243028;--bg2:#2c3a31;--bg3:#354439;
  --chalk:rgba(255,240,200,0.9);--chalk2:rgba(255,240,200,0.5);--chalk3:rgba(255,240,200,0.28);
  --gold:rgba(255,220,140,1);--gold-d:rgba(255,220,140,0.12);--gold-b:rgba(255,220,140,0.25);
  --red:#e06868;--green:#5db896;--amber:#d4a050;
  --ff:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;
  --border:rgba(255,240,200,0.08);--border2:rgba(255,240,200,0.15);
}
.phone{width:100%;max-width:340px;margin:0 auto;border-radius:18px;border:0.5px solid var(--border2);background:var(--bg);overflow:hidden;height:700px;display:flex;flex-direction:column;position:relative;font-family:var(--ff)}
.ph-s{height:18px;padding:3px 14px;display:flex;align-items:center;justify-content:space-between;font-size:8px;color:var(--chalk3)}

/* Header */
.gh{padding:14px 16px 8px;flex-shrink:0}
.gh-title{font-size:18px;font-weight:300;color:var(--chalk);letter-spacing:0.5px}
.gh-sub{font-size:10px;color:var(--chalk3);margin-top:2px}

/* Goal list */
.glist{flex:1;overflow-y:auto;padding:0 14px}
.gcard{border-radius:8px;border:0.5px solid var(--border2);background:var(--bg2);padding:12px;margin-bottom:10px}
.gcard-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gcard-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.gcard-info{flex:1;min-width:0}
.gcard-name{font-size:12px;font-weight:500;color:var(--chalk);line-height:1.3}
.gcard-date{font-size:8px;color:var(--chalk3);margin-top:1px}
.gcard-pct{font-size:16px;font-weight:600;color:var(--gold);flex-shrink:0}
.gcard-bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.gcard-bar-fill{height:100%;border-radius:2px}
.gcard-tasks{display:flex;gap:8px;margin-top:8px;font-size:8px;color:var(--chalk3)}
.gcard-tasks b{color:var(--chalk2)}

/* Archive link */
.archive-link{padding:8px 14px;text-align:center;flex-shrink:0}
.archive-link a{font-size:9px;color:var(--chalk3);text-decoration:none}

/* Add goal FAB */
.fab-goal{position:absolute;bottom:54px;right:14px;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#c8920a,#f5d380);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(200,146,10,0.3)}
.fab-goal svg{width:16px;height:16px;stroke:#243028;stroke-width:2.5;fill:none}

/* Bottom tab */
.btab{display:flex;height:42px;border-top:0.5px solid var(--border2);flex-shrink:0;background:var(--bg)}
.btab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.btab-item svg{width:16px;height:16px;stroke:var(--chalk3);fill:none;stroke-width:1.5}
.btab-item span{font-size:7px;color:var(--chalk3)}
.btab-item.active svg{stroke:var(--gold)}
.btab-item.active span{color:var(--gold);font-weight:600}
</style>

<div class="phone">
  <div class="ph-s"><span>14:20</span><span>...</span></div>

  <div class="gh">
    <div class="gh-title">Goals</div>
    <div class="gh-sub">3つのゴールに取り組み中</div>
  </div>

  <div class="glist">
    <!-- Goal 1 -->
    <div class="gcard">
      <div class="gcard-top">
        <div class="gcard-icon" style="background:rgba(224,104,104,0.12)">🎬</div>
        <div class="gcard-info">
          <div class="gcard-name">YouTube登録者1000人</div>
          <div class="gcard-date">目標: 2026年6月末</div>
        </div>
        <div class="gcard-pct">64%</div>
      </div>
      <div class="gcard-bar"><div class="gcard-bar-fill" style="width:64%;background:linear-gradient(90deg,#c8920a,#f5d380)"></div></div>
      <div class="gcard-tasks">タスク <b>3</b>/8完了 ・ 次: 動画編集（3本目）</div>
    </div>

    <!-- Goal 2 -->
    <div class="gcard">
      <div class="gcard-top">
        <div class="gcard-icon" style="background:rgba(93,184,150,0.12)">💪</div>
        <div class="gcard-info">
          <div class="gcard-name">体脂肪率15%以下</div>
          <div class="gcard-date">目標: 2026年8月末</div>
        </div>
        <div class="gcard-pct">72%</div>
      </div>
      <div class="gcard-bar"><div class="gcard-bar-fill" style="width:72%;background:linear-gradient(90deg,var(--green),#8ed8b8)"></div></div>
      <div class="gcard-tasks">タスク <b>5</b>/7完了 ・ 次: ジム予約</div>
    </div>

    <!-- Goal 3 -->
    <div class="gcard">
      <div class="gcard-top">
        <div class="gcard-icon" style="background:rgba(120,168,216,0.12)">💼</div>
        <div class="gcard-info">
          <div class="gcard-name">副業月収10万円</div>
          <div class="gcard-date">目標: 2026年12月末</div>
        </div>
        <div class="gcard-pct">38%</div>
      </div>
      <div class="gcard-bar"><div class="gcard-bar-fill" style="width:38%;background:linear-gradient(90deg,#78a8d8,#a0c8e8)"></div></div>
      <div class="gcard-tasks">タスク <b>2</b>/10完了 ・ 次: コラボ企画連絡</div>
    </div>
  </div>

  <div class="archive-link"><a>アーカイブ済みゴール →</a></div>

  <div class="fab-goal"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>

  <div class="btab">
    <div class="btab-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 8 14"/></svg><span>TODAY</span></div>
    <div class="btab-item"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg><span>TALK</span></div>
    <div class="btab-item active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg><span>GOALS</span></div>
    <div class="btab-item"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>ME</span></div>
  </div>
</div>
