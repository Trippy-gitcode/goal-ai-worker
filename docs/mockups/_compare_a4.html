<!DOCTYPE html><html><head><meta charset="UTF-8"><title>A4 Profile Compare</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0e18;display:flex;gap:8px;padding:6px;height:100vh;overflow:hidden;font-family:-apple-system,sans-serif}
.col{width:50%;display:flex;flex-direction:column;min-width:0}
.lbl{font-size:13px;font-weight:500;color:#c8920a;text-align:center;padding:4px 0}
.fr{flex:1;border-radius:12px;border:0.5px solid #2a2a3e;overflow:hidden;background:#141420}
iframe{width:100%;height:100%;border:none}
</style></head><body>
<div class="col">
<div class="lbl">MOCKUP（元HTML原本）</div>
<div class="fr"><iframe id="mock" src="06d_design_profile.html"></iframe></div>
</div>
<div class="col">
<div class="lbl">実装（本番サイト）</div>
<div class="fr"><iframe id="impl" src="https://goal-ai-frontend.pages.dev/"></iframe></div>
</div>
<script>
document.getElementById('mock').onload=function(){
  try{this.contentWindow.scrollTo(0,99999)}catch(e){}
};
document.getElementById('impl').onload=function(){
  var w=this.contentWindow;
  setTimeout(function(){
    try{w.showPage('myself');w.switchMyselfTab('profile')}catch(e){}
  },2000);
};
</script>
</body></html>
