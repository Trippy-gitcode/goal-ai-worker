<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#243028;--bg2:#2c3a31;--bg3:#354439;
  --chalk:rgba(255,240,200,0.9);--chalk2:rgba(255,240,200,0.5);--chalk3:rgba(255,240,200,0.28);
  --gold:rgba(255,220,140,1);--gold-d:rgba(255,220,140,0.12);--gold-b:rgba(255,220,140,0.25);
  --red:#e06868;--green:#5db896;--amber:#d4a050;
  --sage-blue:rgba(100,160,200,0.8);--sage-orange:rgba(220,160,80,0.8);--sage-green:rgba(120,180,130,0.8);
  --ff:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;
  --border:rgba(255,240,200,0.08);--border2:rgba(255,240,200,0.15);
}
.phone{width:100%;max-width:340px;margin:0 auto;border-radius:18px;border:0.5px solid var(--border2);background:var(--bg);overflow:hidden;height:700px;display:flex;flex-direction:column;position:relative;font-family:var(--ff)}
.ph-s{height:18px;padding:3px 14px;display:flex;align-items:center;justify-content:space-between;font-size:8px;color:var(--chalk3)}

/* Sages header */
.sages{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 14px;flex-shrink:0}
.sage{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0.4;transition:opacity .2s}
.sage.active{opacity:1;box-shadow:0 0 8px rgba(255,220,140,0.15)}
.sage svg{width:18px;height:18px;fill:none;stroke-width:1.5}
.sage-crystal svg{stroke:var(--sage-blue)}
.sage-quill svg{stroke:var(--sage-orange)}
.sage-scope svg{stroke:var(--sage-green)}

/* Chat area */
.chat{flex:1;overflow-y:auto;padding:8px 14px}
.msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
.msg-ai{flex-direction:row}
.msg-user{flex-direction:row-reverse}
.msg-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.msg-av svg{width:12px;height:12px;fill:none;stroke-width:1.5}
.msg-bub{max-width:75%;padding:8px 11px;border-radius:10px;font-size:11px;line-height:1.5}
.msg-ai .msg-bub{background:var(--bg2);color:var(--chalk);border:0.5px solid var(--border)}
.msg-user .msg-bub{background:var(--gold-d);color:var(--chalk);border:0.5px solid var(--gold-b)}
.msg-meta{font-size:7px;color:var(--chalk3);margin-top:3px}

/* Typing indicator */
.typing{display:flex;gap:8px;align-items:flex-start;margin-bottom:12px}
.typing-dots{font-size:11px;color:var(--chalk3);padding:8px 11px;background:var(--bg2);border-radius:10px;border:0.5px solid var(--border);letter-spacing:3px}
.typing-label{font-size:8px;color:var(--chalk3);margin-top:10px}

/* Input */
.talk-input{padding:8px 14px;flex-shrink:0}
.talk-box{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;border:0.5px solid var(--gold-b);background:var(--bg2)}
.talk-text{flex:1;font-size:11px;color:var(--chalk3)}
.talk-btn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.talk-btn-mic svg{width:13px;height:13px;stroke:var(--chalk3);fill:none;stroke-width:1.5}
.talk-btn-send{background:linear-gradient(135deg,#c8920a,#f5d380)}
.talk-btn-send svg{width:13px;height:13px;stroke:#243028;fill:none;stroke-width:2}

/* Swipe hint */
.swipe-hint{position:absolute;right:0;top:50%;transform:translateY(-50%);width:3px;height:40px;border-radius:2px 0 0 2px;background:var(--chalk3);opacity:0.3}

/* Bottom tab */
.btab{display:flex;height:42px;border-top:0.5px solid var(--border2);flex-shrink:0;background:var(--bg)}
.btab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.btab-item svg{width:16px;height:16px;stroke:var(--chalk3);fill:none;stroke-width:1.5}
.btab-item span{font-size:7px;color:var(--chalk3)}
.btab-item.active svg{stroke:var(--gold)}
.btab-item.active span{color:var(--gold);font-weight:600}
</style>

<div class="phone">
  <div class="ph-s"><span>14:20</span><span>...</span></div>

  <!-- Three sages -->
  <div class="sages">
    <div class="sage sage-crystal">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 19h20L12 2z"/><path d="M12 8v5"/><circle cx="12" cy="15" r="0.5"/></svg>
    </div>
    <div class="sage sage-quill active">
      <svg viewBox="0 0 24 24"><path d="M20 2c-2 0-6 2-8 6-1 2-1 4-1 6 0 1-1 3-3 4l-1 1 2 2 1-1c1-2 3-3 4-3 2 0 4 0 6-1 4-2 6-6 6-8V2z"/><path d="M8 18l-3 3"/></svg>
    </div>
    <div class="sage sage-scope">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat">
    <div class="msg msg-user">
      <div class="msg-bub">会議が午後なくなったんだけど、タスクどう調整したらいい？</div>
    </div>

    <div class="msg msg-ai">
      <div class="msg-av" style="background:rgba(220,160,80,0.15)">
        <svg viewBox="0 0 24 24" stroke="var(--sage-orange)"><path d="M20 2c-2 0-6 2-8 6-1 2-1 4-1 6 0 1-1 3-3 4l-1 1 2 2 1-1c1-2 3-3 4-3 2 0 4 0 6-1 4-2 6-6 6-8V2z"/></svg>
      </div>
      <div>
        <div class="msg-bub">午後が空いたんですね。提案です:<br><br>14:00-16:00 動画編集を前倒し<br>16:00-17:00 コラボ企画連絡<br><br>動画編集は集中力が必要なので、午後の長い空き時間に移すと効率的です。変更しますか？</div>
        <div class="msg-meta">14:21</div>
      </div>
    </div>

    <div class="msg msg-user">
      <div class="msg-bub">いいね、それでお願い</div>
    </div>

    <div class="msg msg-ai">
      <div class="msg-av" style="background:rgba(220,160,80,0.15)">
        <svg viewBox="0 0 24 24" stroke="var(--sage-orange)"><path d="M20 2c-2 0-6 2-8 6-1 2-1 4-1 6 0 1-1 3-3 4l-1 1 2 2 1-1c1-2 3-3 4-3 2 0 4 0 6-1 4-2 6-6 6-8V2z"/></svg>
      </div>
      <div>
        <div class="msg-bub">タスクを更新しました。TODAYに反映済みです。</div>
        <div class="msg-meta">14:21</div>
      </div>
    </div>

    <!-- Typing indicator -->
    <div class="typing">
      <div class="msg-av" style="background:rgba(220,160,80,0.15)">
        <svg viewBox="0 0 24 24" stroke="var(--sage-orange)" fill="none" stroke-width="1.5"><path d="M20 2c-2 0-6 2-8 6-1 2-1 4-1 6 0 1-1 3-3 4l-1 1 2 2 1-1c1-2 3-3 4-3 2 0 4 0 6-1 4-2 6-6 6-8V2z"/></svg>
      </div>
    </div>
  </div>

  <!-- Swipe hint for history -->
  <div class="swipe-hint"></div>

  <!-- Input -->
  <div class="talk-input">
    <div class="talk-box">
      <div class="talk-text">話しかける</div>
      <div class="talk-btn talk-btn-mic"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></div>
      <div class="talk-btn talk-btn-send"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div>
    </div>
  </div>

  <!-- Bottom tabs -->
  <div class="btab">
    <div class="btab-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 8 14"/></svg>
      <span>TODAY</span>
    </div>
    <div class="btab-item active">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <span>TALK</span>
    </div>
    <div class="btab-item">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
      <span>GOALS</span>
    </div>
    <div class="btab-item">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>ME</span>
    </div>
  </div>
</div>
