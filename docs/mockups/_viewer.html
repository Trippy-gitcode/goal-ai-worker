<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup Viewer</title>
<style>
:root{
--color-background-primary:#141420;
--color-background-secondary:#1a1a2e;
--color-background-info:#2a3a5c;
--color-text-primary:#e8e8e8;
--color-text-secondary:#888;
--color-text-tertiary:#555;
--color-text-info:#8ab4f8;
--color-border-tertiary:#2a2a3e;
--color-border-secondary:#444;
}
body{background:#0e0e18;padding:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0}
</style>
</head>
<body>
<div id="mockup-container"></div>
<script>
var params = new URLSearchParams(location.search);
var file = params.get('f');
if(file){
  fetch(file).then(r=>r.text()).then(html=>{
    document.getElementById('mockup-container').innerHTML = html;
  });
}
</script>
</body>
</html>
